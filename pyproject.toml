[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-webcam"
version = "0.5.0"
description = "Displays your webcam video feed with a Matrix-style effect."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Johannes Schuck", email = "jojoschuck@gmail.com" }]
requires-python = ">=3.11,<3.14"
keywords = ["matrix", "webcam", "opencv", "skype"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
# opencv-contrib-python is pulled in transitively by mediapipe -- do not also
# declare opencv-python, the two packages install into the same cv2 namespace
# and silently overwrite each other (see PLAN.md Phase 0 step 3).
dependencies = [
    "numpy>=2.0",
    "mediapipe>=1.0.1",
]

[project.optional-dependencies]
dev = ["pre-commit", "mypy>=1.10", "black>=24.0", "ruff>=0.6"]
deploy = ["wheel", "twine", "build", "setuptools"]

[project.urls]
Homepage = "https://github.com/joschuck/matrix-webcam"

[project.scripts]
matrix-webcam = "matrix_webcam.__main__:main"

[tool.setuptools]
packages = ["matrix_webcam"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.black]
target-version = ["py311", "py312", "py313"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
